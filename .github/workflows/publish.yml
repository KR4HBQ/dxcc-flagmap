# Nightly: fetch your log from Wavelog, render the PNGs and publish them on GitHub Pages.
#
# Setup (fork or copy this repository, then in its Settings):
#   Secrets and variables > Actions > Secrets:    WAVELOG_API_KEY   (read-only v1 key)
#   Secrets and variables > Actions > Variables:  WAVELOG_URL       e.g. https://log.example.com
#                                                 CALLSIGN          e.g. N0CALL
#                                                 WAVELOG_STATION_ID  optional, default "all"
#                                                 FLAGMAP_ARGS      optional extra CLI flags,
#                                                                   e.g. --theme dark --metric confirmed
#   Pages > Build and deployment > Source: GitHub Actions  (optionally a custom domain)
# Images are then served at https://<user>.github.io/<repo>/dxcc-grid.png and dxcc-map.png.
# The job is skipped while WAVELOG_URL is unset, so forks stay quiet until configured.
name: publish
on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write           # keepalive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    if: vars.WAVELOG_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Render
        env:
          WAVELOG_API_KEY: ${{ secrets.WAVELOG_API_KEY }}
          WAVELOG_URL: ${{ vars.WAVELOG_URL }}
          WAVELOG_STATION_ID: ${{ vars.WAVELOG_STATION_ID || 'all' }}
          CALLSIGN: ${{ vars.CALLSIGN }}
          FLAGMAP_ARGS: ${{ vars.FLAGMAP_ARGS }}
        run: |
          # FLAGMAP_ARGS is split into words on purpose
          wavelog-flagmap --url "$WAVELOG_URL" --station-id "$WAVELOG_STATION_ID" \
            --callsign "$CALLSIGN" -o site $FLAGMAP_ARGS
          python scripts/site_index.py site "$CALLSIGN"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy_try
        # Pages sometimes answers "Deployment failed, try again later"; retry once after a pause
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 90
      - id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity;
        # re-enabling the workflow from inside a run resets that.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
