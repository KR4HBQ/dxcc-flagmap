# Nightly: fetch your log (Wavelog, LoTW or an ADIF URL), render the PNGs and publish them on GitHub Pages.
#
# Setup (fork or copy this repository, then in its Settings > Secrets and variables > Actions):
#   Variables:  CALLSIGN            e.g. N0CALL
#               FLAGMAP_ARGS        optional extra CLI flags, e.g. --theme dark --metric confirmed
#   plus ONE source:
#     Wavelog:  WAVELOG_URL (e.g. https://log.example.com), secret WAVELOG_API_KEY (read-only v1 key),
#               optional variable WAVELOG_STATION_ID (default "all")
#     LoTW:     LOTW_USERNAME, secret LOTW_PASSWORD
#     Club Log: secret CLUBLOG_TOKEN (Club Log > Settings > API), log callsign = CALLSIGN
#     QRZ:      secret QRZ_LOGBOOK_KEY (QRZ Logbook > Settings; needs a QRZ subscription)
#     WRL:      secret WRL_API_KEY (World Radio League > Integrations > Developer API); worked only
#     ADIF URL: ADIF_URL, a public link to an ADIF export of any logger
#   WAVELOG_URL, LOTW_USERNAME and ADIF_URL may be variables or secrets. This repository's Actions logs
#   are public and show variable values, so make them secrets to keep them private; then (or when more
#   than one source is configured) set the variable FLAGMAP_SOURCE to wavelog, lotw, clublog, qrz, wrl or adif.
#   Pages > Build and deployment > Source: GitHub Actions  (optionally a custom domain)
# Images are then served at https://<user>.github.io/<repo>/dxcc-grid.png and dxcc-map.png.
# The job is skipped until a source is configured, so forks stay quiet.
name: publish
on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:

permissions: {}           # each job asks for what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    # secrets can't be used in job conditions, so a source configured only through secrets needs FLAGMAP_SOURCE
    if: vars.WAVELOG_URL != '' || vars.LOTW_USERNAME != '' || vars.ADIF_URL != '' || vars.FLAGMAP_SOURCE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # actions are pinned to commits; Dependabot (.github/dependabot.yml) proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the Render step runs with your keys; keep the token out of .git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # exact, hash-checked dependencies, and the tool runs from src/ (no build step pulling unpinned
      # packages): a hijacked release on PyPI can't reach your keys
      - run: pip install --require-hashes -r requirements-publish.txt
      - name: Render
        env:
          WAVELOG_API_KEY: ${{ secrets.WAVELOG_API_KEY }}
          WAVELOG_URL: ${{ secrets.WAVELOG_URL || vars.WAVELOG_URL }}
          WAVELOG_STATION_ID: ${{ vars.WAVELOG_STATION_ID || 'all' }}
          LOTW_USERNAME: ${{ secrets.LOTW_USERNAME || vars.LOTW_USERNAME }}
          LOTW_PASSWORD: ${{ secrets.LOTW_PASSWORD }}
          CLUBLOG_TOKEN: ${{ secrets.CLUBLOG_TOKEN }}
          QRZ_LOGBOOK_KEY: ${{ secrets.QRZ_LOGBOOK_KEY }}
          WRL_API_KEY: ${{ secrets.WRL_API_KEY }}
          ADIF_URL: ${{ secrets.ADIF_URL || vars.ADIF_URL }}
          FLAGMAP_SOURCE: ${{ vars.FLAGMAP_SOURCE }}
          CALLSIGN: ${{ vars.CALLSIGN }}
          FLAGMAP_ARGS: ${{ vars.FLAGMAP_ARGS }}
          PYTHONPATH: src
        run: |
          src="$FLAGMAP_SOURCE"
          if [ -z "$src" ]; then
            if [ -n "$WAVELOG_URL" ]; then src=wavelog; elif [ -n "$LOTW_USERNAME" ]; then src=lotw; else src=adif; fi
          fi
          case "$src" in
            wavelog) set -- --url "$WAVELOG_URL" --station-id "$WAVELOG_STATION_ID" ;;
            lotw|clublog|qrz|wrl) set -- --source "$src" ;;
            adif)    set -- --adif "$ADIF_URL" ;;
            *) echo "unknown FLAGMAP_SOURCE '$src' (use wavelog, lotw, clublog, qrz, wrl or adif)"; exit 1 ;;
          esac
          # FLAGMAP_ARGS is split into words on purpose
          python -m wavelog_flagmap "$@" --callsign "$CALLSIGN" -o site $FLAGMAP_ARGS
          python scripts/site_index.py site "$CALLSIGN"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: site
      - id: deploy_try
        # Pages sometimes answers "Deployment failed, try again later"; retry once after a pause
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 90
      - id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      - id: deploy
        run: echo "page_url=${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity;
    # re-enabling the workflow from inside a run resets that. A separate job, so only this
    # step (which runs no project code) holds a token that can change workflows.
    if: vars.WAVELOG_URL != '' || vars.LOTW_USERNAME != '' || vars.ADIF_URL != '' || vars.FLAGMAP_SOURCE != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
