[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavelog-flagmap"
version = "0.1.0"
description = "Flag Counter-style worked-DXCC flag grid and world map images from Wavelog, for QRZ bios and websites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "PyYAML>=6", "requests>=2.28"]
keywords = ["amateur-radio", "ham-radio", "wavelog", "dxcc", "adif", "qrz"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest", "cairosvg"]

[project.urls]
Homepage = "https://github.com/KR4HBQ/wavelog-flagmap"

[project.scripts]
wavelog-flagmap = "wavelog_flagmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wavelog_flagmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
