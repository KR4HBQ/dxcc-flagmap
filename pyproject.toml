[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dxcc-flagmap"
version = "0.1.0"
description = "Flag Counter-style worked-DXCC flag grid and world map images from Wavelog, LoTW, Club Log, QRZ Logbook, World Radio League or ADIF, for QRZ bios and websites."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "PyYAML>=6", "requests>=2.28"]
keywords = ["amateur-radio", "ham-radio", "dxcc", "wavelog", "lotw", "clublog", "qrz", "adif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest", "cairosvg"]

[project.urls]
Homepage = "https://github.com/KR4HBQ/dxcc-flagmap"

[project.scripts]
dxcc-flagmap = "dxcc_flagmap.cli:main"
wavelog-flagmap = "dxcc_flagmap.cli:main"  # old name, kept for existing scripts

[tool.hatch.build.targets.wheel]
packages = ["src/dxcc_flagmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
