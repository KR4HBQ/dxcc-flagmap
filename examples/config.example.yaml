# dxcc-flagmap configuration. Copy to config.yaml and edit.
# ${VAR} values are read from environment variables, so keep secrets out of this file.

callsign: N0CALL            # shown in the grid title
metric: qsos                # qsos = QSOs per entity | confirmed = confirmed QSOs per entity
confirmed_by: lotw,qsl      # what counts as confirmed: lotw, qsl, eqsl, qrz, clublog, dcl
                            # (lotw,qsl = ARRL DXCC rules and Wavelog's DXCC page default)
theme: light                # light | dark
output_dir: ./out           # dxcc-grid.png, dxcc-map.png, dxcc-stats.json are written here

# --- data source: pick ONE ---------------------------------------------------
wavelog:
  url: https://log.example.com        # your Wavelog base URL
  api: v1                             # v1 = read-only API key | v2 = wl2_ bearer token
  key: ${WAVELOG_API_KEY}             # export WAVELOG_API_KEY=... before running
  # allow_http: true                  # only for a plain http:// URL on a trusted network (the key would
                                      #   travel unencrypted; http://localhost is always allowed)
  station_id: all                     # Station Location ID(s) (Wavelog > Station Locations):
                                      #   all (default: every location, new ones included automatically)
                                      #   | 1 | 1,3,5 | 1-12

# lotw:                               # or ARRL Logbook of The World (all QSOs you uploaded;
#   username: ${LOTW_USERNAME}        #   "confirmed" then means LoTW-confirmed only)
#   password: ${LOTW_PASSWORD}
#   owncall: N0CALL                   # optional: only QSOs made as this callsign

# source:
#   adif: ./my-log.adi                # or an ADIF export from any logger: a file path
#   # adif: https://example.org/log.adi   # or a public URL
#   type: lotw                        # pick explicitly if several sources are configured
#                                     # (default: adif, else wavelog, else lotw)

# --- optional tuning ---------------------------------------------------------
grid:
  rows: 8                   # entries per column
  max_entries: 48
  labels: prefix            # prefix under each count (K, VE, DL...) | none
  # title: "My DX"
map:
  view: cropped             # cropped (bigger flags, polar entities pinned to the edge) | full
  width: 1600
  # flag_w: 36
  # flag_h: 27
